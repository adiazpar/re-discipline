name: community server
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Local server setup and MCP connectivity
        run: |
          python3 scripts/community-local.py up
          python3 scripts/smoke.py --service http://127.0.0.1:7346
          python3 scripts/community-smoke.py --service http://127.0.0.1:7346
        working-directory: .
      - name: Stop local server
        if: always()
        working-directory: .
        run: |
          if [ -f "$HOME/.re-discipline/servers/local/installation.json" ]; then
            python3 scripts/community-local.py stop
          fi
