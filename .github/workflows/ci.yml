name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: retrieval/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vet and test
        working-directory: retrieval
        run: |
          go vet ./...
          go test ./...
      - name: Verify native artifact matches the pinned canonical build
        run: go run ./scripts/build.go -check
      - name: Verify research evaluation contracts without model dependencies
        run: python scripts/test_evaluate_reranker.py
      - name: Install reference agent hosts and the plugin through each marketplace
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.291 @openai/codex@0.164.0
          claude plugin marketplace add ./
          claude plugin install re-discipline@re-discipline --scope user
          codex plugin marketplace add ./
          codex plugin add re-discipline@re-discipline
      - name: Verify native install, corpus, MCP adapters, hooks, and real host discovery
        run: python scripts/smoke.py --hosts
